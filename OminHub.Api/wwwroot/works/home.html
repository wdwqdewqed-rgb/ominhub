    let tooltipEl = null;

    function showTooltip(target, html) {
      if (!tooltipEl) {
        tooltipEl = document.createElement("div");
        tooltipEl.className = "smart-tooltip";
        document.body.appendChild(tooltipEl);
      }

      tooltipEl.innerHTML = html;

      const rect = target.getBoundingClientRect();

      tooltipEl.style.left = rect.left + "px";
      tooltipEl.style.top = rect.bottom + 8 + "px";

      tooltipEl.classList.add("visible");
    }

    function hideTooltip() {
      if (tooltipEl) {
        tooltipEl.classList.remove("visible");
      }
    }

    document.addEventListener("mouseover", (e) => {
      const el = e.target.closest("[data-tooltip]");
      if (!el) return;

      showTooltip(el, el.dataset.tooltip);
    });

    document.addEventListener("mouseout", (e) => {
      if (e.target.closest("[data-tooltip]")) {
        hideTooltip();
      }
    });


    function buildMetaSummary(categories, views) {
      if (!categories || categories.length === 0)
        return formatViews(views) + " views";

      const visible = categories.slice(0, 2);
      const hidden = categories.length - visible.length;

      let html = visible.map(c => escapeHtml(c)).join(" · ");

      if (hidden > 0) {
        const rest = categories.slice(2).map(escapeHtml).join("<br>");
        html += ` · <span class="meta-more" data-tooltip="${rest}">+${hidden} categories</span>`;
      }

      html += " · " + formatViews(views) + " views";
      return html;
    }


    function renderSmartChips(list, maxVisible = 3) {
      const visible = list.slice(0, maxVisible);
      const hidden = list.length - visible.length;

      const chips = visible
        .map(t => `<span class="video-tag">${escapeHtml(t)}</span>`)
        .join("");

      if (hidden > 0) {
        const rest = list.slice(maxVisible).map(escapeHtml).join("<br>");
        return chips +
          `<span class="video-tag more" data-tooltip="${rest}">+${hidden}</span>`;
      }

      return chips;
    }

    function mapApiVideoToCardModel(v) {
      return {

        duration: v.duration ?? "00:00",
        views: v.views ?? 0,

    function getStored(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    }

    function isFavorite(id) {
      const favs = getStored(STORE_KEYS.favorites, []);
      return favs.includes(String(id));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatViews(v) {
      const num = typeof v === "number" ? v : Number(v);
      if (!isFinite(num)) return "0";
      if (num >= 1_000_000)
        return (num / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
      if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, "") + "K";
      return String(num);
    }

    const BASE_PATH = (window.OMINHUB_BASE_PATH || ".").replace(/\/+$/, "");

    function createVideoCard(video, options) {
      options = options || {};
      const wrapper = document.createElement("article");
      wrapper.className = "video-card";
      const watchHref =
        resolveHref("watch") + "?id=" + encodeURIComponent(video.id);

      wrapper.innerHTML = [
        '<div class="video-thumb-wrapper">',
        '  <img class="video-thumb" src="' +
        video.thumb +
        '" alt="' +
        escapeHtml(video.title) +
        '">',
        '  <div class="video-duration">' + video.duration + "</div>",
        "</div>",
        '<div class="video-body">',
        '  <div class="video-title">' + escapeHtml(video.title) + "</div>",
        '  <div class="video-meta">' +
        buildMetaSummary(video.categories, video.views) +
        "</div>",

        '  <div class="video-tags">' +
        renderSmartChips(video.tags, 3) +
        "</div>",

        '  <div class="video-actions">',
        '    <button class="btn-pill" type="button">Watch</button>',
        '    <span class="favorite-indicator" title="Add to favorites">&#9825;</span>',
        "  </div>",
        "</div>",
      ].join("");

      wrapper.addEventListener("click", function (e) {
        const isButton =
          e.target.closest("button") ||
          e.target.classList.contains("favorite-indicator");
        if (e.target.classList.contains("favorite-indicator")) {
          e.stopPropagation();
          toggleFavorite(video.id, e.target);
          return;
        }
        if (isButton && e.target.classList.contains("btn-pill")) {
          window.location.href = watchHref;
          return;
        }
        window.location.href = watchHref;
      });

      const favEl = wrapper.querySelector(".favorite-indicator");
      if (favEl && isFavorite(video.id)) {
        favEl.textContent = "♥";
      }

      return wrapper;
    }

    function renderPagination(current, total) {
      pag.innerHTML = "";

      if (total <= 1) return;

      const prev = document.createElement("button");
      prev.textContent = "Prev";
      prev.disabled = current === 1;
      prev.onclick = () => loadFeatured(current - 1);
      pag.appendChild(prev);

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        if (i === current) btn.classList.add("active");
        btn.onclick = () => loadFeatured(i);
        pag.appendChild(btn);
      }

      const next = document.createElement("button");
      next.textContent = "Next";
      next.disabled = current === total;
      next.onclick = () => loadFeatured(current + 1);
      pag.appendChild(next);
    }



    async function loadFeatured(page = 1) {
      grid.innerHTML = "<div class='loading'>Loading...</div>";

      try {
        const res = await fetch(
          API_BASE + `/api/system/featured?page=${page}&pageSize=12`
        );

        if (!res.ok) throw new Error();

        const data = await res.json();

        renderFromData(data, page);

      } catch {

        /////////////////////////////////////

        /*grid.innerHTML = "<div class='error'>Failed to load videos</div>";*/

        /////////////////////////////////////

        /////////////////////////////////////
        const pageSize = 12;
        const totalPages = Math.ceil(DEMO_VIDEOS.length / pageSize);

        const start = (page - 1) * pageSize;
        const items = DEMO_VIDEOS.slice(start, start + pageSize);

        const data = {
          items,
          totalPages
        };

        renderFromData(data, page);
        /////////////////////////////////////
        //Logica demo//
        /////////////////////////////////////
      }
    }
    function renderFromData(data, page) {
      grid.innerHTML = "";

      data.items
        .map(mapApiVideoToCardModel)
        .forEach(v => grid.appendChild(createVideoCard(v)));

      renderPagination(page, data.totalPages);
    }

    function resolveHref(pageKey) {

        case "home":
